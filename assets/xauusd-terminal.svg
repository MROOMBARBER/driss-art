  <title id="terminal-title">Concept d’interface de l’application XAUUSD</title>
  <desc id="terminal-desc">Illustration d’un terminal sombre et d’une application mobile, avec des graphiques dorés du marché de l’or. Aucun cours réel ni résultat de trading n’est représenté.</desc>
  <defs>
